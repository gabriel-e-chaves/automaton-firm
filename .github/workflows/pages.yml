name: Deploy Palco to Pages

on:
  push:
    branches: [delisting-event-study, main]
  schedule:
    # Daily at 06:00 UTC (03:00 America/Sao_Paulo), after the 00:00 UTC funding
    # settlement, so the replayed window always ends on a settled day.
    # NOTE: GitHub only fires `schedule` from the DEFAULT branch's workflow file.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc first: the Palco imports types from dist/, and the baked snapshot is
      # produced by the motor's own buildSnapshot rather than hand-written JSON.
      - run: pnpm run typecheck
      - run: pnpm --filter @conway/palco test
      - name: Rebuild the 90-day replay from fresh Binance data
        run: node_modules/.bin/tsx scripts/study/build-carry-replay.ts
      - name: Bake the snapshot into the build
        run: node_modules/.bin/tsx scripts/study/export-snapshot.ts
      - name: Build Palco for the project Pages path
        run: pnpm --filter @conway/palco exec vite build
        env:
          PALCO_BASE: /automaton-firm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/palco/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
