name: Deploy Palco to Pages

on:
  push:
    branches: [delisting-event-study, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc first: the Palco imports types from dist/, and the baked snapshot is
      # produced by the motor's own buildSnapshot rather than hand-written JSON.
      - run: pnpm run typecheck
      - run: pnpm --filter @conway/palco test
      # The snapshot is COMMITTED, not fetched here: Binance answers 451
      # (geo-block) to GitHub's US runners, so the daily refresh runs wherever
      # Binance is reachable and pushes snapshot.json; this workflow only
      # builds and publishes what is in the repo.
      - name: Build Palco for the project Pages path
        run: pnpm --filter @conway/palco exec vite build
        env:
          PALCO_BASE: /automaton-firm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/palco/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
